[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gphotos-to-synology"
version = "1.2.0.2"
description = "Unattended background migration of Google Photos Takeout archives to Synology DSM / Synology Photos"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Oleksandr Danylchenko" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "google-api-python-client>=2.150.0,<3.0.0",
    "google-auth>=2.35.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "pillow>=11.1.0,<12.3.0",
    "pillow-heif>=1.0.0,<1.1.0",
    "piexif>=1.1.3,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
spk = [
    "pyinstaller>=6.10.0,<7.0.0",
]

[project.scripts]
gphotos-synology = "gphotos_synology.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gphotos_synology = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PIE", "RUF"]
ignore = ["E501"]
