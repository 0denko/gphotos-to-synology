services:
  gphotos-migrator:
    image: ghcr.io/0denko/gphotos-to-synology:latest
    container_name: gphotos-to-synology
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - PUID=1026
      - PGID=100
      - TZ=UTC
    volumes:
      # App config, database, scratch work, quarantine & inbox (subfolders auto-created)
      - /volume1/docker/gphotos-migrator:/data
      # Target Synology Photos folder:
      #   Shared Space:   /volume1/photo:/data/photos
      #   Personal Space: /volume1/homes/<YOUR_DSM_USER>/Photos:/data/photos
      - /volume1/photo:/data/photos
    extra_hosts:
      - "host.docker.internal:host-gateway"
