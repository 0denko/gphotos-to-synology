services:
  gphotos-migrator:
    image: ghcr.io/0denko/gphotos-to-synology:1.2.0
    container_name: gphotos-to-synology
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    ports:
      # Bound to loopback by default (C1); place behind DSM Reverse Proxy or set API_TOKEN before exposing on LAN
      - "127.0.0.1:8765:8765"
    environment:
      - PUID=${PUID:-1026}
      - PGID=${PGID:-100}
      - TZ=UTC
      - API_TOKEN=${API_TOKEN:-}
      - WATCHTOWER_URL=http://updater:8080
      - WATCHTOWER_TOKEN=${WATCHTOWER_TOKEN:?Set a unique random WATCHTOWER_TOKEN in .env}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=gphotos-migrator"
    volumes:
      # App config, database, scratch work, quarantine & inbox (subfolders auto-created)
      - /volume1/docker/gphotos-migrator:/data
      # Synology Photos Shared Space (/photo)
      - /volume1/photo:/data/photos
      # All Synology users' Personal Spaces (/homes/<user>/Photos) for the User Picker
      - /volume1/homes:/data/homes
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Scoped auto-updater: checks for new gphotos-to-synology images every 6h
  # and enables the 1-click "Update Now" button inside the Synology DSM window.
  updater:
    image: nickfedor/watchtower:latest
    container_name: gphotos-to-synology-updater
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCOPE=gphotos-migrator
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=21600
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN:?Set a unique random WATCHTOWER_TOKEN in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
